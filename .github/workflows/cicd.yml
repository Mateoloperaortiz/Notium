name: CI-CD-Pipeline

permissions:
  contents: write

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  # 1. JOB BUILD
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Checks
      - name: Run checks
        run: npm run check

      # 5. Build
      - name: Build
        run: npm run build

      # 6. Verificar carpeta dist
      - name: Verificar carpeta dist
        run: ls -R dist

      # 7. Upload build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: dist/

  # 2. JOB DEPLOY
  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Solo desplegar cuando hay push a main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # 1. Descargar artifact del job build
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: sitio
          path: dist/

      # 2. Deploy a GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
