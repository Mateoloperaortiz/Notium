services:
  backend:
    image: notium-backend:latest
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      SQLITE_PATH: /app/data/database.sqlite
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  frontend:
    image: notium-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  sqlite-data:
